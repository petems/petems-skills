[[repos]]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-added-large-files" },
]

[[repos]]
repo = "https://github.com/igorshubovych/markdownlint-cli"
rev = "v0.48.0"
hooks = [
  { id = "markdownlint", args = ["--fix"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "simplify-chrome-trace-tests", name = "simplify-chrome-trace-petems tests", entry = "node --test skills/simplify-chrome-trace-petems/tests/*.test.mjs", language = "system", files = "^skills/simplify-chrome-trace-petems/", pass_filenames = false },
]
