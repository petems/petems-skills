[project]
name = "three-bill"
version = "0.1.0"
description = "Download Three UK bill PDFs through the My3 JSON API, driving a dedicated Patchright Chromium profile."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "patchright>=1.55.0",
]

[project.scripts]
three-bill = "three_bill.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["three_bill*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    # Needs a real Chromium. Loads no Three page: a local fake of the My3 API
    # is served from 127.0.0.1, so it stays offline. Deselect with -m 'not browser'.
    "browser: drives a real Chromium against a local fake of the My3 API",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
