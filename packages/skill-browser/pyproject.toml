[project]
name = "skill-browser"
version = "0.1.0"
description = "Shared Patchright plumbing for petems-skills browser CLIs: profile lease, human login, typed exit codes, redacted diagnostics."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "patchright>=1.55.0",
]

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skill_browser*"]

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.11.11",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "browser: drives a real Chromium (offline: local pages only)",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "RUF"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
